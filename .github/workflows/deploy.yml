name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        env:
          PUBLIC_PROBLEMS_BASE_URL: ${{ vars.PUBLIC_PROBLEMS_BASE_URL }}
          PUBLIC_ADOBE_CLIENT_ID_LOCAL: ${{ vars.PUBLIC_ADOBE_CLIENT_ID_LOCAL }}
          PUBLIC_ADOBE_CLIENT_ID_PROD: ${{ vars.PUBLIC_ADOBE_CLIENT_ID_PROD }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
